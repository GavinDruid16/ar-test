name: VBF Repair Transport

on:
  push:
    branches:
      - vbf-full-migration-20260905

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message != 'Repair VBF relationship transport corruption'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair exact transport-corrupted literals
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('vbf/crates/vbf-relationship/src/validation.rs')
          text = path.read_text()
          replacements = {
              'Key::new(brelationship.operated_by")': 'Key::new("relationship.operated_by")',
              'Key::new(brelationship.instance.test")': 'Key::new("relationship.instance.test")',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one occurrence of {old!r}, found {count}')
              text = text.replace(old, new)
          path.write_text(text)
          PY
      - name: Commit repaired source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vbf/crates/vbf-relationship/src/validation.rs
          git diff --cached --exit-code && exit 0
          git commit -m "Repair VBF relationship transport corruption"
          git push
