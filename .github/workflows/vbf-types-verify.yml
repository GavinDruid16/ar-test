name: VBF Types Verify

on:
  workflow_dispatch:
  push:
    branches:
      - vbf-cargo-verify-20260904
    paths:
      - 'vbf/crates/vbf-types/**'
      - '.github/workflows/vbf-types-verify.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vbf
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          rustc --version
          cargo --version
      - name: Cargo check
        run: cargo check --workspace
      - name: Cargo test
        run: cargo test --workspace
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Normalize rustfmt
        run: cargo fmt --all
      - name: Commit rustfmt normalization
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .
            git commit -m "Normalize migrated VBF Rust formatting"
            git push
          fi
      - name: Rustfmt check
        run: cargo fmt --all -- --check
