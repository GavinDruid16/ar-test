name: VBF Format Once

on:
  push:
    branches:
      - vbf-full-migration-20260905

permissions:
  contents: write

jobs:
  format:
    if: github.event.head_commit.message != 'Normalize migrated VBF Rust formatting'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Format complete VBF workspace
        working-directory: vbf
        run: cargo fmt --all
      - name: Commit canonical rustfmt output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vbf
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Normalize migrated VBF Rust formatting"
          git push
