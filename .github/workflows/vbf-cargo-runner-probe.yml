name: VBF Cargo Runner Probe

on:
  push:
    branches:
      - vbf-cargo-verify-20260904

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: |
          rustc --version
          cargo --version
          cargo fmt --version
          cargo clippy --version
      - name: Compile probe
        run: |
          rm -rf /tmp/vbf-cargo-probe
          cargo new --bin --edition 2024 /tmp/vbf-cargo-probe
          cargo check --manifest-path /tmp/vbf-cargo-probe/Cargo.toml
          cargo test --manifest-path /tmp/vbf-cargo-probe/Cargo.toml
