[workspace]
members = [
    "crates/vbf-types",
    "crates/vbf-schema",
    "crates/vbf-entity",
    "crates/vbf-relationship",
    "crates/vbf-spatial",
    "crates/vbf-package",
    "crates/vbf-validation",
    "crates/vbf-information",
    "crates/vbf-event",
    "crates/vbf-store",
    "crates/vbf-compiler",
    "crates/vbf-cli",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v7"] }
